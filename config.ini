# ViaShell — конфиг панели и меню.
# Положи копию в ~/.config/viashell/config.ini и правишь под себя.
# 1 = показать, 0 = скрыть.

[panel]
# Элементы самой панели (вертикальная бар)
logo = true
workspaces = true
system = true
clock = true
# Чип режима sway/swayfx (default / resizing) — только под sway
mode = true

[menu]
# Секции в главном меню (выплывающем из логотипа)
theme = true
media = true
workspaces = true
wifi = true
clipboard = true
messages = true
power = true
